[project]
name = "aml-transaction-monitoring"
version = "0.1.0"
description = "AML transaction monitoring on synthetic UK data: typology rules, sanctions screening and honest evaluation"
authors = [
    { name = "Vivek Nalegavamath", email = "242837689+viveksnalegavamath-hash@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "faker>=40.40.0",
    "fastapi>=0.142.2",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "networkx>=3.7",
    "numpy>=2.3.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
aml-transaction-monitoring = "aml_transaction_monitoring:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
