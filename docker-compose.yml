services:
  db:
    image: postgres:16
    container_name: aml-postgres
    # Only the database's own settings (not the whole .env, which also holds
    # the API's secrets). Values come from .env by variable substitution.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Read-only FastAPI service. Before the first start:
  #   uv run python -m aml_transaction_monitoring.api.provision    (role + secrets)
  #   uv run python -m aml_transaction_monitoring.api.model_store  (model export)
  # Swagger docs: http://127.0.0.1:8000/docs
  api:
    build: .
    image: aml-api:1
    container_name: aml-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      API_KEY: ${API_KEY:?run api.provision first}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?run api.provision first}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data/ml/api:/app/model:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
