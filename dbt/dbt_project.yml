# dbt project: raw data -> tested staging views -> mart tables.
# Run from this folder: dbt build

name: aml_transaction_monitoring
version: "1.0.0"
config-version: 2
profile: aml_transaction_monitoring

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

vars:
  # Dev sample: "10% account sample (≈19% of rows)". Off by default, so a plain
  # `dbt build` always uses all 9.5M rows. Sample build (development speed only;
  # all reported results come from the full data):
  #   dbt build --vars '{dev_sample: true}'
  # It writes to staging_sample, marts_sample, evaluation_sample, never over
  # the full tables.
  dev_sample: false
  dev_sample_percent: 10

flags:
  # No anonymous usage data sent to dbt Labs.
  send_anonymous_usage_stats: false

models:
  aml_transaction_monitoring:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    features:
      # ML features per account-week (Phase 3). No label.
      +schema: features
      +materialized: table
    evaluation:
      # Suspicious label and typology only. Never read by rules or features.
      +schema: evaluation
      +materialized: table

seeds:
  aml_transaction_monitoring:
    +schema: staging
    evaluation:
      # Typology names are part of the label: kept with the evaluation model.
      +schema: evaluation
