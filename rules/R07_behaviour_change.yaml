# Rule spec. Thresholds live here, never in code. The logic is in
# src/aml_transaction_monitoring/rules/sql/R07.sql, which receives every value
# below as a bound query parameter.

id: R07
name: Behaviour change
version: 2
typology: >
  Behaviour change: an account's activity suddenly departs from its own past,
  with a sharp rise in the money moving through it (for example an account
  taken over or sold to a money-mule network).
logic: >
  Looks at all the account's activity, money sent and received. Alert when a
  transaction brings the account's volume over the last `spike_days` days to
  at least `min_volume_gbp` and above `spike_multiple` times its average
  volume per `spike_days` days over the `baseline_days` days before that. The
  account must have been in the data for at least `min_history_days` days,
  the whole baseline period must fall after its first transaction, and the
  baseline must be above zero. (Version 1 also alerted on reactivation after
  90 dormant days; removed in version 2, see the change log.)
sql: R07.sql
parameters:
  spike_days: 30
  baseline_days: 90
  spike_multiple: 15
  min_volume_gbp: 25000
  min_history_days: 90
suppression_days: 7
reason: >
  Behaviour change: volume of £{recent_gbp:,.2f} in {recent_n} transactions
  within {spike_days} days, {ratio:,.1f} times the previous average of
  £{baseline_avg_gbp:,.2f} (rule: {spike_days}-day volume of at least
  £{min_volume_gbp:,.0f} and more than {spike_multiple} times the average
  {spike_days}-day volume of the previous {baseline_days} days; account at
  least {min_history_days} days in the data).
rationale: >
  Firms must scrutinise transactions for consistency with the customer's
  profile (MLR 2017 reg. 28(11)) and apply enhanced due diligence where there
  is an unusual pattern of transactions (reg. 33(1)(f)). Rules tailored to the
  firm's risks: FCA FCG 3.2. Sharp changes in turnover are a common
  money-mule indicator.
expected_weekly_alerts: 392  # tuning period, full data, version 2 (tuning 25 Oct 2026)
owner: Vivek Nalegavamath (AML rules owner, portfolio project)
last_tuned: 2026-10-25
change_log:
  - date: 2026-10-22
    version: 1
    change: >
      Created with the project plan's starting values (30-day volume more than
      5 times the prior 90-day monthly average, or dormant 90+ days then
      active).
    reason: >
      Not yet tuned (tuning uses Oct 2022 – May 2023 only). History is
      measured from the account's first transaction in the data, not the
      synthetic KYC onboarding date. Volume counts money sent and received.
  - date: 2026-10-25
    version: 2
    change: >
      Removed the dormancy clause; spike multiple 5 -> 15; added a minimum
      30-day volume of £25,000 (min_volume_gbp). Kept rather than disabled.
    reason: >
      Version 1 produced 44% of all tuning-month alerts (5,591/week) at lift
      0.8x, worse than random. The dormancy clause alone had lift 0.1-0.2x at
      every minimum volume, so it was removed. The spike clause improves
      steadily with stricter values; 15x and £25,000 give 392 alerts/week
      (-93%), precision 4.8%, lift 6.2x, account recall 38.4% -> 24.5%.
      Lift is above the 2x bar set for keeping the rule (else disable, like
      R10). Tuned on Oct 2022 – May 2023 only (full data); hold-out not used for the choice. Option B of the combined proposal (Vivek, 25 Oct 2026): total alerts per week -64%, "any rule" account recall 78.5% on the tuning months (baseline 84.8%); see docs/results/tuning_R07.md.
