# Rule spec. Thresholds live here, never in code. The logic is in
# src/aml_transaction_monitoring/rules/sql/R02.sql, which receives every value
# below as a bound query parameter.

id: R02
name: Many-to-one
version: 1
typology: >
  Funnelling (smurfing, fan-in, layered fan-in): many different people pay
  into one account in a short time, often to gather funds before moving them on.
logic: >
  Alert the receiving account when, within `window_days` days, it receives
  money from at least `min_senders` different accounts, totalling at least
  `min_total_gbp`.
sql: R02.sql
parameters:
  min_senders: 10
  min_total_gbp: 20000
  window_days: 7
suppression_days: 7
reason: >
  Received £{total_gbp:,.2f} from {n_senders} different accounts in
  {n_transactions} payments within {window_days} days (rule: at least
  {min_senders} senders and £{min_total_gbp:,.0f}).
rationale: >
  Scrutiny must test whether activity fits the customer's profile (MLR 2017
  reg. 28(11)), with rules tailored to typologies (FCA FCG 3.2). Many
  unrelated senders funnelling money into one account is a common pattern of
  money mules and collection accounts.
expected_weekly_alerts: null  # set from the baseline run (step 6)
owner: Vivek Nalegavamath (AML rules owner, portfolio project)
last_tuned: null
change_log:
  - date: 2026-10-22
    version: 1
    change: Created with the project plan's starting values.
    reason: Not yet tuned (tuning uses Oct 2022 – May 2023 only).
