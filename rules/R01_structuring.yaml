# Rule spec. Thresholds live here, never in code. The logic is in
# src/aml_transaction_monitoring/rules/sql/R01.sql, which receives every value
# below as a bound query parameter.

id: R01
name: Structuring
version: 1
typology: >
  Structuring: cash paid in as several deposits, each kept just under a
  round threshold (here £10,000) to avoid attention.
logic: >
  Alert the account receiving the cash when it gets at least `min_deposits`
  cash deposits, each between `min_amount_gbp` and `max_amount_gbp`, within
  `window_days` days.
sql: R01.sql
parameters:
  min_amount_gbp: 8000
  max_amount_gbp: 9999.99
  min_deposits: 3
  window_days: 7
# After an alert, no new R01 alert for the same account for this many days.
suppression_days: 7
reason: >
  {n_deposits} cash deposits of £{min_amount_gbp:,.0f}–£{max_amount_gbp:,.2f}
  within {window_days} days, totalling £{total_gbp:,.2f}.
rationale: >
  Firms must scrutinise transactions for consistency with what they know of
  the customer (MLR 2017 reg. 28(11)); monitoring rules should be tailored to
  typologies and calibrated (FCA FCG 3.2). Repeated cash deposits just below a
  round threshold are a classic structuring red flag.
expected_weekly_alerts: 0  # tuning period, full data, baseline run 25 Oct 2026
owner: Vivek Nalegavamath (AML rules owner, portfolio project)
last_tuned: null
change_log:
  - date: 2026-10-22
    version: 1
    change: Created with the project plan's starting values.
    reason: Textbook structuring band; not yet tuned (tuning uses Oct 2022 – May 2023 only).
  - date: 2026-10-25
    version: 1
    change: Reviewed in tuning (step 7); deliberately left at the textbook values.
    reason: >
      The £8,000–£9,999.99 band sits just below £10,000, the amount at which
      cash must be declared at the UK border and close to the EUR 10,000
      high-value-dealer cash threshold in MLR 2017: the classic pattern of
      keeping each deposit under a round reporting figure. On SAML-D it never
      fires (0 alerts on the full data; only 45 cash deposits fall in the
      band), because SAML-D's structuring deposits are much smaller (average
      about £5,246). Re-fitting the band to this one synthetic dataset would
      tune the rule to the data generator, not to real behaviour; SAML-D's
      structuring is caught instead by other rules (78% of structuring
      transactions by any rule in the baseline hold-out). Kept as a control
      that would fire on real data.
